name: Arena CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      db:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ephemeral-ci-only
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=40
    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: ${{ job.services.db.ports[3306] }}
      TEST_DB_USER: root
      TEST_DB_PASSWORD: ephemeral-ci-only
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest --cov=app --cov-report=term-missing --cov-fail-under=60
      - name: Verify production configuration
        run: |
          python -c "from app import create_app; import os,secrets; os.environ['SECRET_KEY']=secrets.token_hex(32); assert not create_app('prod').debug"

  compose:
    name: compose
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      SECRET_KEY: ephemeral-ci-only-compose-secret-key
      MYSQL_ROOT_PASSWORD: ephemeral-ci-only-root
      DB_PASSWORD: ephemeral-ci-only-app
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build and start the production stack
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Check HTTP and container user
        run: |
          curl --fail --silent --show-error --retry 10 --retry-connrefused http://127.0.0.1:8000/ > /dev/null
          test "$(docker compose exec -T app id -u)" -ne 0
      - name: Publish the verified image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_SHA"
          docker image tag "$(docker compose images -q app)" "$image"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$image"
      - name: Show Compose logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the temporary stack
        if: always()
        run: docker compose down --volumes
