{% extends "base.html" %}
{% from "_ui.html" import csrf with context %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="wrap page">
  <div class="auth-shell">
    <aside class="panel auth-copy"><h2>Возвращайтесь к игре</h2><p>Ваши команды, заявки и матчи ждут в личном кабинете.</p></aside>
    <div class="panel auth-form">
      <h1>Вход на Арену</h1>
      <form method="post" class="fields">
        {{ csrf() }}
        <label class="field"><span>Никнейм или почта</span><input name="login" value="{{ form.login|default('') }}" autocomplete="username" maxlength="120" required></label>
        <label class="field"><span>Пароль</span><input name="password" type="password" autocomplete="current-password" required></label>
        <button class="button" type="submit">Войти</button>
        <p class="quiet muted">Впервые здесь? <a class="text-link" href="/register">Зарегистрироваться</a></p>
      </form>
    </div>
  </div>
</div>
{% endblock %}
