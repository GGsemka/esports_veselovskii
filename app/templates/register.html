{% extends "base.html" %}
{% from "_ui.html" import csrf with context %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="wrap page">
  <div class="auth-shell">
    <aside class="panel auth-copy"><h2>Соберите свой состав</h2><p>Аккаунт игрока позволяет создавать команды и подавать заявки на турниры.</p></aside>
    <div class="panel auth-form">
      <h1>Регистрация</h1>
      <form method="post" class="fields" data-password-match>
        {{ csrf() }}
        <label class="field"><span>Никнейм</span><input name="nickname" value="{{ form.nickname|default('') }}" autocomplete="username" minlength="3" maxlength="20" pattern="[A-Za-z0-9_]{3,20}" required><small>3–20 символов. Латиница, цифры или подчёркивание.</small></label>
        <label class="field"><span>Электронная почта</span><input name="email" type="email" value="{{ form.email|default('') }}" autocomplete="email" maxlength="120" required></label>
        <label class="field"><span>Пароль</span><input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="1024" required><small>Не менее 8 символов.</small></label>
        <label class="field"><span>Повторите пароль</span><input name="confirm" type="password" autocomplete="new-password" minlength="8" maxlength="1024" required></label>
        <button class="button" type="submit">Создать аккаунт</button>
        <p class="quiet muted">Уже есть аккаунт? <a class="text-link" href="/login">Войти</a></p>
      </form>
    </div>
  </div>
</div>
{% endblock %}
